[project]
name = "trading-sp500"
version = "0.1.0"
description = "Testing a Kelly Sizing based betting strategy on the S&P 500."
authors = [{ name = "Patrick Frank", email = "patr.frank@gmx.de" }]
license = "GPL-3.0-or-later"
requires-python = ">=3.13,<4.0"
dependencies = [
    "numpy>=2.5,<3.0",
    "pandas>=3.1,<4.0",
    "matplotlib>=3.11,<4.0",
    "ipywidgets>=8.1,<9.0",
    "joblib>=1.6,<2.0",
    "ipykernel>=7.4,<8.0",
    "requests>=2.34,<3.0",
]

[dependency-groups]
dev = [
    "nbclient>=0.11,<0.12",
    "nbconvert>=7.17,<8.0",
    "jupyterlab>=4.6,<5.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
